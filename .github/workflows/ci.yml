name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión de shellcheck
        run: shellcheck --version
      - name: Analizar scripts y librería
        run: make lint

  test:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Versión de bats
        run: bats --version
      - name: Ejecutar tests
        run: make test
